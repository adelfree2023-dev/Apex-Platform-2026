name: Security & CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/core/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd packages/core
          npm ci
      
      - name: Run Security Audit
        run: |
          cd packages/core
          npm audit --audit-level=high
        continue-on-error: true
      
      - name: Check for Critical Vulnerabilities
        run: |
          cd packages/core
          npm audit --audit-level=critical

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: security-audit
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/core/package-lock.json
      
      - name: Install Dependencies
        run: |
          cd packages/core
          npm ci
      
      - name: Type Check
        run: |
          cd packages/core
          npx tsc --noEmit
      
      - name: Lint
        run: |
          cd packages/core
          npm run lint || true
      
      - name: Build
        run: |
          cd packages/core
          npm run build
      
      - name: Run Tests
        run: |
          cd packages/core
          npm test -- --passWithNoTests
        env:
          NODE_ENV: test
