<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Platform - API Tester</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .card h2 .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .badge-get { background: #10b981; }
        .badge-post { background: #6366f1; }
        
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            color: var(--text);
            margin-bottom: 0.75rem;
            font-family: inherit;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: var(--primary-dark);
        }
        
        .result {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            background: rgba(0,0,0,0.3);
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .result.success { border-left: 3px solid var(--success); }
        .result.error { border-left: 3px solid var(--error); }
        
        .status {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        
        .status.connected { background: rgba(16, 185, 129, 0.2); }
        .status.disconnected { background: rgba(239, 68, 68, 0.2); }

        label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Apex Platform API Tester</h1>
        <p class="subtitle">Phase 01: Vendor Integration — Test Console</p>
        
        <div id="serverStatus" class="status disconnected">
            🔴 Checking server connection...
        </div>
        
        <div class="grid">
            <!-- Health Check -->
            <div class="card">
                <h2><span class="badge badge-get">GET</span> Health Check</h2>
                <button onclick="checkHealth()">Check Health</button>
                <div id="healthResult" class="result"></div>
            </div>
            
            <!-- Create Tenant -->
            <div class="card">
                <h2><span class="badge badge-post">POST</span> Create Tenant</h2>
                <label>Name</label>
                <input type="text" id="tenantName" placeholder="e.g., Maadi Honey" value="Test Store">
                <label>Subdomain</label>
                <input type="text" id="tenantSubdomain" placeholder="e.g., maadi-honey" value="test-store">
                <label>Territory</label>
                <input type="text" id="tenantTerritory" placeholder="e.g., maadi" value="cairo">
                <label>Business Type</label>
                <input type="text" id="tenantBusinessType" placeholder="RETAIL | SERVICE | EDUCATION" value="RETAIL">
                <button onclick="createTenant()">Create Tenant</button>
                <div id="tenantResult" class="result"></div>
            </div>
            
            <!-- List Tenants -->
            <div class="card">
                <h2><span class="badge badge-get">GET</span> List Tenants</h2>
                <button onclick="listTenants()">List All Tenants</button>
                <div id="listTenantsResult" class="result"></div>
            </div>
            
            <!-- Create Product -->
            <div class="card">
                <h2><span class="badge badge-post">POST</span> Create Product</h2>
                <label>Tenant ID</label>
                <input type="text" id="productTenantId" placeholder="Tenant ID (UUID)">
                <label>Product Name</label>
                <input type="text" id="productName" placeholder="e.g., Wild Honey" value="Organic Honey">
                <label>Slug</label>
                <input type="text" id="productSlug" placeholder="e.g., wild-honey" value="organic-honey">
                <label>Price (EGP)</label>
                <input type="number" id="productPrice" placeholder="150" value="200">
                <button onclick="createProduct()">Create Product</button>
                <div id="productResult" class="result"></div>
            </div>
            
            <!-- List Products -->
            <div class="card">
                <h2><span class="badge badge-get">GET</span> List Products</h2>
                <label>Tenant ID</label>
                <input type="text" id="listProductsTenantId" placeholder="Tenant ID (UUID)">
                <button onclick="listProducts()">List Products</button>
                <div id="listProductsResult" class="result"></div>
            </div>
            
            <!-- Shop Health -->
            <div class="card">
                <h2><span class="badge badge-get">GET</span> Shop Health</h2>
                <label>Tenant ID</label>
                <input type="text" id="shopHealthTenantId" placeholder="Tenant ID (UUID)">
                <button onclick="checkShopHealth()">Check Shop Health</button>
                <div id="shopHealthResult" class="result"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://34.102.65.89:3001';
        
        // Check server connection on load
        window.onload = checkHealth;
        
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    ...options,
                    headers: {
                        'Content-Type': 'application/json',
                        ...options.headers
                    }
                });
                const data = await response.json();
                return { success: response.ok, data };
            } catch (error) {
                return { success: false, data: { error: error.message } };
            }
        }
        
        function showResult(elementId, result) {
            const el = document.getElementById(elementId);
            el.className = `result ${result.success ? 'success' : 'error'}`;
            el.textContent = JSON.stringify(result.data, null, 2);
        }
        
        async function checkHealth() {
            const result = await makeRequest(`${API_BASE}/health`);
            showResult('healthResult', result);
            
            const statusEl = document.getElementById('serverStatus');
            if (result.success) {
                statusEl.className = 'status connected';
                statusEl.innerHTML = `🟢 Connected to Apex Core v${result.data.version}`;
            } else {
                statusEl.className = 'status disconnected';
                statusEl.innerHTML = '🔴 Server not reachable';
            }
        }
        
        async function createTenant() {
            const result = await makeRequest(`${API_BASE}/api/admin/tenants`, {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('tenantName').value,
                    subdomain: document.getElementById('tenantSubdomain').value,
                    territory: document.getElementById('tenantTerritory').value,
                    businessType: document.getElementById('tenantBusinessType').value
                })
            });
            showResult('tenantResult', result);
            
            // Auto-fill tenant ID fields
            if (result.success && result.data.id) {
                document.getElementById('productTenantId').value = result.data.id;
                document.getElementById('listProductsTenantId').value = result.data.id;
                document.getElementById('shopHealthTenantId').value = result.data.id;
            }
        }
        
        async function listTenants() {
            const result = await makeRequest(`${API_BASE}/api/admin/tenants`);
            showResult('listTenantsResult', result);
        }
        
        async function createProduct() {
            const tenantId = document.getElementById('productTenantId').value;
            const result = await makeRequest(`${API_BASE}/api/shop/${tenantId}/products`, {
                method: 'POST',
                body: JSON.stringify({
                    name: document.getElementById('productName').value,
                    slug: document.getElementById('productSlug').value,
                    price: parseFloat(document.getElementById('productPrice').value)
                })
            });
            showResult('productResult', result);
        }
        
        async function listProducts() {
            const tenantId = document.getElementById('listProductsTenantId').value;
            const result = await makeRequest(`${API_BASE}/api/shop/${tenantId}/products`);
            showResult('listProductsResult', result);
        }
        
        async function checkShopHealth() {
            const tenantId = document.getElementById('shopHealthTenantId').value;
            const result = await makeRequest(`${API_BASE}/api/shop/${tenantId}/health`);
            showResult('shopHealthResult', result);
        }
    </script>
</body>
</html>
